[project]
name = "gpt2-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yorukot", email = "hi@yorukot.me" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasketch>=2.0.0,<3",
    "datasets>=5.0.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "tensorboard>=2.21.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
